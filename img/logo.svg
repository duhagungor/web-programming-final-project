<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoPastel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5EC" />
      <stop offset="100%" stop-color="#FFD1DC" />
    </linearGradient>
  </defs>
  <!-- Arka plan yuvarlak pastel daire -->
  <circle cx="50" cy="50" r="46" fill="url(#logoPastel)" stroke="#4A3F35" stroke-width="2.5" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <!-- Şef şapkası & Çırpıcı çizimi -->

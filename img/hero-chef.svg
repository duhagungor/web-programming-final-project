<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="50%" stop-color="#FFE5EC" />
      <stop offset="100%" stop-color="#FDE2E4" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4A3F35" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arka Plan Yumuşak Pastel Leke & Çevre Parıltıları -->
  <path d="M70,180 Q40,60 180,50 Q320,40 440,80 Q560,120 540,260 Q520,400 380,440 Q240,480 120,420 Q20,360 70,180 Z" fill="url(#bgGlow)" opacity="0.85"/>
  <circle cx="500" cy="90" r="14" fill="#FFE382" opacity="0.6"/>
  <circle cx="90" cy="110" r="10" fill="#BEE1E6" opacity="0.7"/>
  <circle cx="520" cy="380" r="12" fill="#D8E2DC" opacity="0.7"/>

  <!-- Pırıltılar -->
  <path d="M120 70 L123 78 L131 81 L123 84 L120 92 L117 84 L109 81 L117 78 Z" fill="#FFB703"/>
  <path d="M470 140 L472 146 L478 148 L472 150 L470 156 L468 150 L462 148 L468 146 Z" fill="#FF8FAB"/>

  <!-- Ahşap Pastel Masa -->
  <rect x="60" y="380" width="480" height="24" rx="12" fill="#E8D7F1" stroke="#4A3F35" stroke-width="2.5" filter="url(#softShadow)"/>
  <line x1="90" y1="392" x2="510" y2="392" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Sevimli Pastel Şef Karakteri -->
  <g id="chefCharacter">
    <!-- Gövde & Kıyafet -->
    <path d="M220 380 L230 260 C230 230 310 230 310 260 L320 380 Z" fill="#FFFDF9" stroke="#4A3F35" stroke-width="2.5"/>
    <!-- Pastel Önlük -->
    <path d="M245 260 L295 260 L305 375 L235 375 Z" fill="#D8E2DC" stroke="#4A3F35" stroke-width="2.5"/>
    <path d="M255 240 L255 260 M285 240 L285 260" stroke="#A8D5BA" stroke-width="3" stroke-linecap="round"/>
    <rect x="255" y="300" width="30" height="24" rx="4" fill="#FFF8F0" stroke="#4A3F35" stroke-width="1.8"/>
    <!-- Önlük Cebi İçinde Havuç -->
    <path d="M265 295 L272 305 L268 307 Z" fill="#FFB4A2" stroke="#4A3F35" stroke-width="1.5"/>
    <path d="M263 293 L265 290" stroke="#88B04B" stroke-width="2" stroke-linecap="round"/>

    <!-- Kafa & Yüz -->
    <circle cx="270" cy="180" r="42" fill="#FFE5D9" stroke="#4A3F35" stroke-width="2.5"/>
    <!-- Sevimli Yanaklar -->
    <ellipse cx="248" cy="192" rx="7" ry="4" fill="#FF8FAB" opacity="0.6"/>
    <ellipse cx="292" cy="192" rx="7" ry="4" fill="#FF8FAB" opacity="0.6"/>
    <!-- Gözler (Mutlu kapalı kavis) -->
    <path d="M248 180 Q254 174 260 180" stroke="#4A3F35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M280 180 Q286 174 292 180" stroke="#4A3F35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Gülümseyen Ağız -->
    <path d="M265 194 Q270 200 275 194" stroke="#4A3F35" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Saçlar -->
    <path d="M232 170 C230 150 250 145 270 145 C295 145 310 155 308 170 C295 160 280 162 270 160 C255 162 242 162 232 170 Z" fill="#6B4D3C" stroke="#4A3F35" stroke-width="2"/>

    <!-- Pofuduk Şef Şapkası -->
    <path d="M235 150 C215 110 240 85 260 95 C275 75 300 85 305 105 C320 115 315 145 305 150 Z" fill="#FFFDF9" stroke="#4A3F35" stroke-width="2.5"/>
    <rect x="236" y="142" width="68" height="12" rx="4" fill="#FFE5EC" stroke="#4A3F35" stroke-width="2"/>
    <line x1="270" y1="102" x2="270" y2="142" stroke="#F4ACB7" stroke-width="1.5" stroke-dasharray="2 3"/>

    <!-- Kollar & Eller -->
    <!-- Sol Kol - Çırpıcı Tutuyor -->
    <path d="M230 260 Q190 280 200 320" stroke="#4A3F35" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M230 260 Q190 280 200 320" stroke="#FFFDF9" stroke-width="15" stroke-linecap="round" fill="none"/>
    <circle cx="202" cy="325" r="9" fill="#FFE5D9" stroke="#4A3F35" stroke-width="2"/>
    <!-- Elindeki Çırpıcı -->
    <line x1="202" y1="325" x2="218" y2="355" stroke="#4A3F35" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="223" cy="365" rx="9" ry="14" transform="rotate(-25 223 365)" fill="none" stroke="#4A3F35" stroke-width="2"/>

    <!-- Sağ Kol - Tepsi / Pasta Taşıyor -->
    <path d="M310 260 Q345 285 330 320" stroke="#4A3F35" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M310 260 Q345 285 330 320" stroke="#FFFDF9" stroke-width="15" stroke-linecap="round" fill="none"/>
    <circle cx="330" cy="325" r="9" fill="#FFE5D9" stroke="#4A3F35" stroke-width="2"/>
  </g>

  <!-- Masadaki Pastel Detaylar -->
  <!-- Pastel Çilekli Mini Pasta Standı -->
  <g id="cakeStand">
    <path d="M320 380 L360 380 L350 340 L330 340 Z" fill="#FCD5CE" stroke="#4A3F35" stroke-width="2"/>
    <ellipse cx="340" cy="340" rx="42" ry="10" fill="#FFF8F0" stroke="#4A3F35" stroke-width="2.5"/>
    <!-- Pasta Keki -->
    <path d="M310 338 L310 305 Q340 300 370 305 L370 338 Z" fill="#FFD1DC" stroke="#4A3F35" stroke-width="2.5"/>
    <!-- Beyaz Krema Dalgaları -->
    <path d="M310 310 Q317 318 325 310 Q332 318 340 310 Q347 318 355 310 Q362 318 370 310" stroke="#FFFDF9" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Üstündeki Çilek & Nane -->
    <path d="M335 292 Q340 282 345 292 Q340 302 335 292 Z" fill="#FF6B6B" stroke="#4A3F35" stroke-width="1.5"/>
    <path d="M340 285 Q345 280 348 285" stroke="#88B04B" stroke-width="2" fill="none"/>
    <!-- Lezzetli Buhar Dalgaları -->
    <path d="M330 270 Q325 255 333 245" stroke="#F4ACB7" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M345 268 Q350 252 342 242" stroke="#F4ACB7" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="3 3"/>
  </g>

  <!-- Pastel Mavi Karıştırma Kasesi (Masanın solunda) -->
  <g id="mixingBowl">
    <path d="M120 380 Q105 380 110 340 L180 340 Q185 380 170 380 Z" fill="#BEE1E6" stroke="#4A3F35" stroke-width="2.5"/>
    <ellipse cx="145" cy="340" rx="35" ry="8" fill="#FFFDF9" stroke="#4A3F35" stroke-width="2"/>
    <!-- Kaseden çıkan ahşap kaşık -->
    <line x1="150" y1="345" x2="175" y2="295" stroke="#C9A690" stroke-width="4" stroke-linecap="round"/>
    <circle cx="178" cy="292" r="6" fill="#FCD5CE" stroke="#4A3F35" stroke-width="1.8"/>
  </g>

  <!-- Masadaki Pastel Baharatlık / Yağlık Şişesi -->
  <g id="oilBottle">
    <rect x="420" y="325" width="22" height="55" rx="6" fill="#D8E2DC" stroke="#4A3F35" stroke-width="2"/>
    <rect x="426" y="315" width="10" height="10" rx="2" fill="#FFE5D9" stroke="#4A3F35" stroke-width="1.8"/>
    <path d="M428 340 Q431 343 434 340" stroke="#88B04B" stroke-width="2" fill="none"/>
  </g>

  <!-- Uçuşan Kalpler ve Sevimli Not -->
  <path d="M210 150 C205 140 190 145 190 155 C190 165 210 180 210 180 C210 180 230 165 230 155 C230 145 215 140 210 150 Z" fill="#FF8FAB" transform="rotate(-15 210 150) scale(0.7)"/>
  <path d="M370 180 C365 170 350 175 350 185 C350 195 370 210 370 210 C370 210 390 195 390 185 C390 175 375 170 370 180 Z" fill="#FF8FAB" transform="rotate(20 370 180) scale(0.6)"/>
</svg>

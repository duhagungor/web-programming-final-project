  <path d="M35 45 C35 43 65 43 65 45 L63 52 C63 54 37 54 37 52 Z" fill="#D8E2DC" stroke="#4A3F35" stroke-width="2.5"/>
  
  <!-- Çapraz Tahta Kaşık ve Çırpıcı -->
  <!-- Kaşık -->
  <line x1="33" y1="72" x2="67" y2="46" stroke="#C9A690" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="67" cy="46" rx="6" ry="4" transform="rotate(-35 67 46)" fill="#FCD5CE" stroke="#4A3F35" stroke-width="2.5"/>
  <!-- Çırpıcı teli -->

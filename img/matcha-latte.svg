<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPastelMatcha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FAF4" />
      <stop offset="100%" stop-color="#E5F2E5" />
    </linearGradient>
    <filter id="cupShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#4A3F35" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="20" fill="url(#bgPastelMatcha)" />
  <circle cx="90" cy="80" r="32" fill="#FFF" opacity="0.6"/>
  <circle cx="330" cy="220" r="38" fill="#FFF" opacity="0.5"/>

  <!-- Fincan Tabağı -->
  <ellipse cx="190" cy="225" rx="115" ry="32" fill="#FFFDF9" stroke="#4A3F35" stroke-width="2.5" filter="url(#cupShadow)"/>
  <ellipse cx="190" cy="225" rx="90" ry="22" fill="#E8D7F1" opacity="0.4"/>

  <!-- Fincan Kulpu -->
  <path d="M265 155 C305 155 305 195 260 200" fill="none" stroke="#4A3F35" stroke-width="8" stroke-linecap="round"/>
  <path d="M265 155 C305 155 305 195 260 200" fill="none" stroke="#D8E2DC" stroke-width="4" stroke-linecap="round"/>

  <!-- Geniş Seramik Fincan / Kase (Chawan) -->
  <g id="matchaCup" filter="url(#cupShadow)">
    <path d="M120 150 C120 220 260 220 260 150 Z" fill="#D8E2DC" stroke="#4A3F35" stroke-width="2.5"/>
    <ellipse cx="190" cy="150" rx="70" ry="24" fill="#FAF3E0" stroke="#4A3F35" stroke-width="2.5"/>
    <!-- İçi Köpüklü Pastel Matcha -->
    <ellipse cx="190" cy="152" rx="63" ry="19" fill="#99D98C" stroke="#4A3F35" stroke-width="1.8"/>
  </g>

  <!-- Latte Art - Kalp Çizimi -->
  <g transform="translate(190, 152) scale(0.7)">
    <path d="M0 0 C-10 -18 -30 0 0 25 C30 0 10 -18 0 0 Z" fill="#FFFDF9"/>
  </g>

  <!-- Bambu Çırpıcı (Chasen) - Yanda -->
  <g transform="translate(305, 130) rotate(15)">
    <!-- Çırpıcı Sapı -->
    <rect x="-8" y="0" width="16" height="35" rx="4" fill="#EAD7C3" stroke="#4A3F35" stroke-width="2"/>
    <line x1="-8" y1="20" x2="8" y2="20" stroke="#4A3F35" stroke-width="2"/>
    <!-- Bambu Telleri -->
    <path d="M-12 35 C-18 65 -6 75 0 75 C6 75 18 65 12 35 Z" fill="#F7EBE1" stroke="#4A3F35" stroke-width="2"/>
    <line x1="0" y1="35" x2="0" y2="72" stroke="#C9A690" stroke-width="1.5"/>
    <line x1="-6" y1="35" x2="-5" y2="70" stroke="#C9A690" stroke-width="1.5"/>
    <line x1="6" y1="35" x2="5" y2="70" stroke="#C9A690" stroke-width="1.5"/>
  </g>

  <!-- Hafif Sıcak Buhar -->
  <path d="M180 115 Q175 95 185 80" stroke="#A8D5BA" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M200 110 Q205 90 195 75" stroke="#A8D5BA" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="3 3"/>

  <!-- Pırıltı -->
  <path d="M110 85 L112 91 L118 93 L112 95 L110 101 L108 95 L102 93 L108 91 Z" fill="#52B788"/>
</svg>

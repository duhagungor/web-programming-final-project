<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPastelOlive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5" />
      <stop offset="100%" stop-color="#F2EFE9" />
    </linearGradient>
    <filter id="dolmaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#4A3F35" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="20" fill="url(#bgPastelOlive)" />
  <circle cx="80" cy="80" r="30" fill="#FFF" opacity="0.6"/>
  <circle cx="330" cy="220" r="40" fill="#FFF" opacity="0.5"/>

  <!-- Beyaz Oval Ege Tabağı -->
  <ellipse cx="200" cy="210" rx="145" ry="48" fill="#FFFDF9" stroke="#4A3F35" stroke-width="2.5" filter="url(#dolmaShadow)"/>
  <ellipse cx="200" cy="210" rx="120" ry="34" fill="#F8F9FA" stroke="#D8E2DC" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Kabak Çiçeği Dolması 1 -->
  <g transform="translate(150, 185) rotate(-15)">
    <!-- Çiçek Gövdesi -->
    <path d="M-20 10 C-30 -25 -10 -45 10 -45 C30 -45 40 -25 30 10 Z" fill="#FFD166" stroke="#4A3F35" stroke-width="2.5"/>
    <path d="M-5 10 C-10 -20 0 -40 10 -45 C20 -40 25 -20 20 10 Z" fill="#FFE29A"/>
    <!-- Çiçek Sapı & Yeşil Taç -->
    <path d="M-20 10 L5 25 L30 10 Z" fill="#88B04B" stroke="#4A3F35" stroke-width="2"/>
    <line x1="5" y1="25" x2="10" y2="35" stroke="#88B04B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Kabak Çiçeği Dolması 2 -->
  <g transform="translate(225, 180) rotate(15)">
    <path d="M-20 10 C-30 -25 -10 -45 10 -45 C30 -45 40 -25 30 10 Z" fill="#FFD166" stroke="#4A3F35" stroke-width="2.5"/>
    <path d="M-5 10 C-10 -20 0 -40 10 -45 C20 -40 25 -20 20 10 Z" fill="#FFE29A"/>
    <path d="M-20 10 L5 25 L30 10 Z" fill="#88B04B" stroke="#4A3F35" stroke-width="2"/>
    <line x1="5" y1="25" x2="0" y2="35" stroke="#88B04B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Zeytinyağı Parıltıları -->
  <ellipse cx="190" cy="210" rx="12" ry="5" fill="#FFEAA7" opacity="0.7"/>
  <ellipse cx="230" cy="215" rx="8" ry="3" fill="#FFEAA7" opacity="0.7"/>

  <!-- Yarım Limon Dilimi -->
  <g transform="translate(275, 195) rotate(-25)">
    <path d="M-20 0 C-20 20 20 20 20 0 Z" fill="#FFE382" stroke="#4A3F35" stroke-width="2"/>
    <path d="M-16 0 C-16 15 16 15 16 0 Z" fill="#FFFDF0"/>
  </g>

  <!-- Taze Dereotu Dalı -->
  <g transform="translate(130, 205) rotate(40)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#52B788" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="0" x2="15" y2="-8" stroke="#52B788" stroke-width="1.5"/>
    <line x1="18" y1="0" x2="23" y2="8" stroke="#52B788" stroke-width="1.5"/>
    <line x1="26" y1="0" x2="31" y2="-7" stroke="#52B788" stroke-width="1.5"/>
  </g>

  <!-- Pırıltı -->
  <path d="M100 85 L102 91 L108 93 L102 95 L100 101 L98 95 L92 93 L98 91 Z" fill="#88B04B"/>
</svg>

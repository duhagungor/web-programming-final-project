<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPastelGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F7F2" />
      <stop offset="100%" stop-color="#E8F0E8" />
    </linearGradient>
    <filter id="shadowToast" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4A3F35" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="20" fill="url(#bgPastelGreen)" />
  <circle cx="320" cy="70" r="35" fill="#FFF" opacity="0.6" />
  <circle cx="70" cy="230" r="30" fill="#FFF" opacity="0.5" />

  <!-- Şık Ahşap Servis Tahtası -->
  <g filter="url(#shadowToast)">
    <rect x="70" y="70" width="260" height="175" rx="25" fill="#EAD7C3" stroke="#4A3F35" stroke-width="2.5"/>
    <!-- Tahta Sapı -->
    <rect x="330" y="135" width="35" height="30" rx="8" fill="#EAD7C3" stroke="#4A3F35" stroke-width="2.5"/>
    <circle cx="350" cy="150" r="6" fill="#F2F7F2" stroke="#4A3F35" stroke-width="2"/>
    <line x1="90" y1="90" x2="310" y2="90" stroke="#FFF" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Kızarmış Ekşi Mayalı Ekmek Dilimi -->
  <path d="M110 115 C130 95 240 95 270 115 C285 125 285 185 270 205 C250 215 130 215 110 205 C95 185 95 125 110 115 Z" fill="#E5B27A" stroke="#4A3F35" stroke-width="2.5"/>
  <path d="M115 120 C135 105 235 105 265 120 C275 130 275 180 265 198 C245 208 135 208 115 198 C105 180 105 130 115 120 Z" fill="#F5CBA7" stroke="#4A3F35" stroke-width="1.5"/>

  <!-- Ezilmiş Pastel Avokado Püresi -->
  <path d="M120 125 C140 112 230 112 255 125 C268 138 268 175 255 190 C235 202 140 202 120 190 C110 175 110 138 120 125 Z" fill="#A8D5BA" stroke="#4A3F35" stroke-width="2"/>
  
  <!-- Avokado Doku Çizgileri -->
  <path d="M130 135 Q145 145 135 160" stroke="#79A887" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M235 135 Q245 150 240 165" stroke="#79A887" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M140 180 Q160 170 170 185" stroke="#79A887" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Avokado Dilimleri -->
  <g transform="translate(130, 130) rotate(-15)">
    <path d="M0 0 C15 -10 35 10 30 25 C20 30 5 15 0 0 Z" fill="#C5E1A5" stroke="#4A3F35" stroke-width="1.8"/>
  </g>
  <g transform="translate(210, 130) rotate(15)">
    <path d="M0 0 C15 -10 35 10 30 25 C20 30 5 15 0 0 Z" fill="#C5E1A5" stroke="#4A3F35" stroke-width="1.8"/>
  </g>

  <!-- Ortada Kusursuz Poşe Yumurta -->
  <ellipse cx="190" cy="155" rx="36" ry="28" fill="#FFFDF9" stroke="#4A3F35" stroke-width="2.5"/>
  <!-- Akan Sarı Sarısı -->
  <circle cx="192" cy="153" r="16" fill="#FFC857" stroke="#4A3F35" stroke-width="2"/>
  <ellipse cx="188" cy="149" rx="5" ry="3" fill="#FFEAA7" opacity="0.8"/>
  <!-- Pul Biber & Chia Serpmeleri -->
  <circle cx="185" cy="165" r="1.5" fill="#E63946"/>
  <circle cx="198" cy="162" r="1.5" fill="#E63946"/>
  <circle cx="202" cy="145" r="1.5" fill="#E63946"/>
  <circle cx="180" cy="148" r="1.5" fill="#3D3430"/>
  <circle cx="205" cy="170" r="1.5" fill="#3D3430"/>
  <circle cx="160" cy="155" r="1.5" fill="#3D3430"/>

  <!-- Pırıltı -->
  <path d="M85 75 L87 81 L93 83 L87 85 L85 91 L83 85 L77 83 L83 81 Z" fill="#88B04B"/>
</svg>

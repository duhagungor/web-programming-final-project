<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPastelLemon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="100%" stop-color="#FEF9E7" />
    </linearGradient>
    <filter id="cakeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#4A3F35" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="20" fill="url(#bgPastelLemon)" />
  <circle cx="90" cy="80" r="32" fill="#FFF" opacity="0.6"/>
  <circle cx="330" cy="220" r="38" fill="#FFF" opacity="0.5"/>

  <!-- Porselen Pasta Tabağı -->
  <ellipse cx="200" cy="215" rx="145" ry="42" fill="#E8D7F1" stroke="#4A3F35" stroke-width="2.5" filter="url(#cakeShadow)"/>
  <ellipse cx="200" cy="215" rx="120" ry="30" fill="#FFFDF9" stroke="#D3BCC0" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Üçgen Cheesecake Dilimi -->
  <g id="cheesecakeSlice">
    <!-- Alt Taban (Bisküvi Kırıntısı) -->
    <path d="M120 195 L270 205 L290 170 L210 155 Z" fill="#DDB892" stroke="#4A3F35" stroke-width="2.5"/>
    <path d="M120 195 L270 205 L270 195 L120 185 Z" fill="#C69C72" stroke="#4A3F35" stroke-width="2"/>

    <!-- Peynir Gövdesi (İpeksi Krem Katmanı) -->
    <path d="M120 185 L270 195 L290 135 L190 120 Z" fill="#FFFDF0" stroke="#4A3F35" stroke-width="2.5"/>
    <!-- Ön Yüz Gölgelendirme -->
    <path d="M120 185 L270 195 L270 145 L120 135 Z" fill="#FFF3B0" stroke="#4A3F35" stroke-width="2"/>

    <!-- Üst Limon Curd Sosu (Pastel Sarı) -->
    <path d="M120 135 L270 145 L290 135 L190 120 Z" fill="#FFE382" stroke="#4A3F35" stroke-width="2.5"/>
    
    <!-- Ön Tarafa Sızan Limon Sosu Damlaları -->
    <path d="M150 146 C150 158 158 158 158 146" fill="#FFE382" stroke="#4A3F35" stroke-width="1.8"/>
    <path d="M220 150 C220 162 227 162 227 150" fill="#FFE382" stroke="#4A3F35" stroke-width="1.8"/>
  </g>

  <!-- Üstündeki Limon Dilimi & Lavanta Dalı -->
  <!-- Limon Dilimi -->
  <g transform="translate(230, 125) rotate(-20)">
    <circle cx="0" cy="0" r="22" fill="#FFE382" stroke="#4A3F35" stroke-width="2"/>
    <circle cx="0" cy="0" r="17" fill="#FFFDF0" stroke="#FFE382" stroke-width="1.5"/>
    <!-- Limon Dilim Çizgileri -->
    <line x1="0" y1="-17" x2="0" y2="17" stroke="#FFE382" stroke-width="1.5"/>
    <line x1="-17" y1="0" x2="17" y2="0" stroke="#FFE382" stroke-width="1.5"/>
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#FFE382" stroke-width="1.5"/>
    <line x1="-12" y1="12" x2="12" y2="-12" stroke="#FFE382" stroke-width="1.5"/>
  </g>

  <!-- Narin Lavanta Dalı -->
  <g transform="translate(180, 115) rotate(35)">
    <line x1="0" y1="0" x2="0" y2="50" stroke="#88B04B" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="-4" cy="10" rx="3" ry="5" fill="#B392AC" stroke="#4A3F35" stroke-width="1"/>
    <ellipse cx="4" cy="12" rx="3" ry="5" fill="#B392AC" stroke="#4A3F35" stroke-width="1"/>
    <ellipse cx="-3" cy="22" rx="3" ry="5" fill="#B392AC" stroke="#4A3F35" stroke-width="1"/>
    <ellipse cx="3" cy="24" rx="3" ry="5" fill="#B392AC" stroke="#4A3F35" stroke-width="1"/>
    <ellipse cx="0" cy="2" rx="2.5" ry="4" fill="#E8D7F1" stroke="#4A3F35" stroke-width="1"/>
  </g>

  <!-- Pırıltılar -->
  <path d="M100 90 L102 96 L108 98 L102 100 L100 106 L98 100 L92 98 L98 96 Z" fill="#FFE382"/>
  <path d="M305 85 L307 91 L313 93 L307 95 L305 101 L303 95 L297 93 L303 91 Z" fill="#B392AC"/>
</svg>

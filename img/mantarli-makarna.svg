<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPastelWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F7EBE1" />
    </linearGradient>
    <filter id="panShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#4A3F35" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="20" fill="url(#bgPastelWarm)" />
  <circle cx="70" cy="70" r="30" fill="#FFF" opacity="0.6"/>
  <circle cx="330" cy="230" r="40" fill="#FFF" opacity="0.4"/>

  <!-- Döküm Tava Kulpu -->
  <rect x="290" y="175" width="65" height="18" rx="8" fill="#D8E2DC" stroke="#4A3F35" stroke-width="2.5" filter="url(#panShadow)" transform="rotate(20 290 175)"/>
  <circle cx="340" cy="195" r="5" fill="#FFFDF9" stroke="#4A3F35" stroke-width="1.8"/>

  <!-- Pastel Seramik Tava Tabanı & Kenarı -->
  <g id="pastaPan" filter="url(#panShadow)">
    <ellipse cx="190" cy="190" rx="125" ry="50" fill="#D8E2DC" stroke="#4A3F35" stroke-width="2.5"/>
    <ellipse cx="190" cy="180" rx="115" ry="42" fill="#FAF3E0" stroke="#4A3F35" stroke-width="2"/>
    <ellipse cx="190" cy="180" rx="105" ry="36" fill="#F4EDE2" />
  </g>

  <!-- Rigatoni Makarnalar (Tüpler) -->
  <!-- Makarna 1 -->
  <g transform="translate(140, 160) rotate(-15)">
    <rect x="0" y="0" width="35" height="16" rx="4" fill="#FEE440" stroke="#4A3F35" stroke-width="2"/>
    <line x1="8" y1="0" x2="8" y2="16" stroke="#E0B634" stroke-width="1.5"/>
    <line x1="18" y1="0" x2="18" y2="16" stroke="#E0B634" stroke-width="1.5"/>
    <line x1="28" y1="0" x2="28" y2="16" stroke="#E0B634" stroke-width="1.5"/>
  </g>

  <!-- Makarna 2 -->
  <g transform="translate(195, 155) rotate(25)">
    <rect x="0" y="0" width="35" height="16" rx="4" fill="#FEE440" stroke="#4A3F35" stroke-width="2"/>
    <line x1="8" y1="0" x2="8" y2="16" stroke="#E0B634" stroke-width="1.5"/>
    <line x1="18" y1="0" x2="18" y2="16" stroke="#E0B634" stroke-width="1.5"/>
    <line x1="28" y1="0" x2="28" y2="16" stroke="#E0B634" stroke-width="1.5"/>
  </g>

  <!-- Makarna 3 -->
  <g transform="translate(160, 180) rotate(5)">
    <rect x="0" y="0" width="38" height="16" rx="4" fill="#FEE440" stroke="#4A3F35" stroke-width="2"/>
    <line x1="10" y1="0" x2="10" y2="16" stroke="#E0B634" stroke-width="1.5"/>
    <line x1="20" y1="0" x2="20" y2="16" stroke="#E0B634" stroke-width="1.5"/>
    <line x1="30" y1="0" x2="30" y2="16" stroke="#E0B634" stroke-width="1.5"/>
  </g>

  <!-- Kremalı Sos Girdapları -->
  <path d="M125 185 Q150 170 175 185 Q200 200 230 180" stroke="#FFFDF0" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Sevimli Dağ Mantarları -->
  <!-- Mantar 1 -->
  <g transform="translate(145, 175)">
    <path d="M0 0 C0 -16 26 -16 26 0 Z" fill="#C69C72" stroke="#4A3F35" stroke-width="2"/>
    <rect x="8" y="0" width="10" height="10" rx="2" fill="#EAD7C3" stroke="#4A3F35" stroke-width="1.5"/>
  </g>

  <!-- Mantar 2 -->
  <g transform="translate(210, 170) rotate(-20)">
    <path d="M0 0 C0 -16 26 -16 26 0 Z" fill="#C69C72" stroke="#4A3F35" stroke-width="2"/>
    <rect x="8" y="0" width="10" height="10" rx="2" fill="#EAD7C3" stroke="#4A3F35" stroke-width="1.5"/>
  </g>

  <!-- Taze Kekik Yaprakları -->
  <circle cx="160" cy="165" r="3" fill="#88B04B"/>
  <circle cx="190" cy="190" r="3" fill="#88B04B"/>
  <circle cx="235" cy="165" r="3" fill="#88B04B"/>
  <circle cx="130" cy="180" r="2" fill="#88B04B"/>

  <!-- Sıcak Buhar -->
  <path d="M170 135 Q165 115 175 100" stroke="#D8E2DC" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M200 130 Q205 110 195 95" stroke="#D8E2DC" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="3 3"/>

  <!-- Pırıltı -->
  <path d="M100 85 L102 91 L108 93 L102 95 L100 101 L98 95 L92 93 L98 91 Z" fill="#FFB703"/>
</svg>
